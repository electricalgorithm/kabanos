# Additive Kconfig fragment: the ONLY purpose is to let this exact kernel tree
# (same SRCREV as meta-kabanos/recipes-kernel/linux/linux-stable_6.18.bb) also
# boot on QEMU's "virt" board, since no QEMU machine model emulates the real
# TI AM335x SoC this image actually targets (verified: `qemu-system-arm -M
# help` has no beaglebone/am33xx entry). Everything else (defconfig +
# container.cfg) is unchanged from the real release build.
#
# Confirmed via arch/arm/Kconfig.platforms: ARCH_VIRT depends on
# ARCH_MULTI_V7 (already implied by CONFIG_SOC_AM33XX=y) and auto-selects
# ARM_AMBA, ARM_GIC(_V3), ARM_PSCI, HAVE_ARM_ARCH_TIMER.
CONFIG_ARCH_MULTI_V7=y
CONFIG_ARCH_VIRT=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_RTC_DRV_PL031=y
