#
# Machine Selection
#
MACHINE ?= "beaglebone-yocto"

# Scoped per-machine: forcing linux-stable unconditionally would break any
# MACHINE it isn't compatible with. linux-stable_6.18.bb declares
# COMPATIBLE_MACHINE = "beaglebone-yocto|qemuarm" -- beaglebone-yocto is the
# real AM335x hardware target; qemuarm builds the same kernel source/version
# with an additive virt-enabling fragment (see
# meta-kabanos/recipes-kernel/linux/files/qemuarm-virt.cfg) so QEMU boot
# validation (qemu-test/) runs the real 6.18 kernel instead of a hand-rolled
# out-of-tree build. Any other MACHINE falls through to its own layer default
# (openembedded-core's qemu.inc sets a weak "??=" linux-yocto default, so a
# hard override here always wins where it applies and is a no-op elsewhere).
# Each line below leaves every OTHER machine's build inputs/output unchanged.
PREFERRED_PROVIDER_virtual/kernel:beaglebone-yocto = "linux-stable"
PREFERRED_PROVIDER_virtual/kernel:qemuarm = "linux-stable"

#
# Where to place downloads
#
DL_DIR ?= "${TOPDIR}/../downloads"

#
# Where to place shared-state files
#
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

#
# Where to place the build output
#
TMPDIR = "/tmp/yocto-tmp"

#
# Default policy config
#
DISTRO ?= "kabanos"

#
# Package Management configuration
#
PACKAGE_CLASSES ?= "package_ipk"

#
# Extra image configuration defaults
#
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

#
# Additional image features
#
USER_CLASSES ?= "buildstats"

#
# Interactive shell configuration
#
PATCHRESOLVE = "noop"

#
# Disk Space Monitoring during the build
#
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

#
# SDK target architecture
#
SDKMACHINE ?= "x86_64"

#
# Qemu configuration
#
PACKAGECONFIG:append:pn-qemu-system-native = " sdl"

#
# CONF_VERSION
#
CONF_VERSION = "2"

IMAGE_INSTALL:append = " podman "

INHERIT += "rm_work"

# SSTATE_MIRRORS disabled; using GitHub Actions cache instead
# SSTATE_MIRRORS ?= "file://.* https://cache.example.com/sstate/PATH"
