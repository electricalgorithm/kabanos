# Additive fragment, applied only for MACHINE=qemuarm (see linux-stable_6.18.bb):
# enables QEMU's "virt" board support so this same kernel source/version/
# defconfig also boots under QEMU, since no QEMU machine model emulates the
# real beaglebone-yocto hardware (AM335x) this kernel otherwise targets.
#
# Verified against upstream kernel source (arch/arm/Kconfig.platforms):
# ARCH_VIRT depends on ARCH_MULTI_V7 and auto-selects ARM_AMBA, ARM_GIC(_V3),
# ARM_PSCI, HAVE_ARM_ARCH_TIMER. Confirmed working via qemu-test/ (identical
# fragment content) before being folded into the real recipe here.
CONFIG_ARCH_MULTI_V7=y
CONFIG_ARCH_VIRT=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_RTC_DRV_PL031=y
