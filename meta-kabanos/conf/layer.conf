# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-kabanos"
BBFILE_PATTERN_meta-kabanos = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kabanos = "7"

LAYERDEPENDS_meta-kabanos = "core"
LAYERSERIES_COMPAT_meta-kabanos = "scarthgap"

DISTRO = "kabanos"
