name: Build Kabanos Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix workspace permissions for container user
        run: sudo chown -R 1000:1000 $GITHUB_WORKSPACE

      - name: Build Docker image
        run: docker compose build

      - name: Start container
        run: docker compose up -d

      - name: Clone Yocto dependencies
        run: docker compose exec yocto-builder bash build.sh

      - name: Run Yocto validation
        run: docker compose exec yocto-builder bash validate.sh

      - name: Cleanup
        run: docker compose down -v

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Yocto sstate
        uses: actions/cache@v4
        with:
          path: |
            sstate-cache
            downloads
          key: yocto-sstate-${{ hashFiles('Dockerfile', 'build.sh', 'build/conf/bblayers.conf') }}
          restore-keys: |
            yocto-sstate-

      - name: Fix workspace permissions for container user
        run: sudo chown -R 1000:1000 $GITHUB_WORKSPACE

      - name: Build Docker image
        run: docker compose build

      - name: Run Yocto build
        run: |
          docker compose up -d
          docker compose exec yocto-builder bash build.sh
          docker compose exec yocto-builder bash -c "source openembedded-core/oe-init-build-env build && bitbake kabanos-image"

      - name: Copy deploy artifacts from container
        run: |
          # $GITHUB_WORKSPACE was chowned to 1000:1000 above so the container's
          # build user (uid 1000) can write build/conf. The runner itself is a
          # different uid (1001), so a plain `docker cp` here fails to create
          # build/tmp/... and used to be masked by `|| true`. Use sudo so the
          # copy always succeeds regardless of who currently owns the tree,
          # then hand ownership back to the runner for the upload/release steps.
          sudo mkdir -p build/tmp/deploy/images/beaglebone-yocto
          sudo docker cp kabanos-yocto:/tmp/yocto-tmp/deploy/images/beaglebone-yocto/. build/tmp/deploy/images/beaglebone-yocto/
          sudo chown -R "$(id -u):$(id -g)" build/tmp
          echo "Deploy artifacts:"
          ls -la build/tmp/deploy/images/beaglebone-yocto/
          test -e build/tmp/deploy/images/beaglebone-yocto/kabanos-image-beaglebone-yocto.wic

      - name: Upload WIC image
        uses: actions/upload-artifact@v4
        with:
          name: kabanos-image
          path: |
            build/tmp/deploy/images/beaglebone-yocto/kabanos-image-beaglebone-yocto.wic
            build/tmp/deploy/images/beaglebone-yocto/*.wic.bmap
          compression-level: 9
          retention-days: 30

      - name: Upload rootfs tarball
        uses: actions/upload-artifact@v4
        with:
          name: kabanos-rootfs
          path: build/tmp/deploy/images/beaglebone-yocto/*.tar.*
          compression-level: 9
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: Kabanos build ${{ github.run_number }}
          body: |
            Automated Yocto build from commit ${{ github.sha }}.
            Machine: beaglebone-yocto
          files: |
            build/tmp/deploy/images/beaglebone-yocto/kabanos-image-beaglebone-yocto.wic
            build/tmp/deploy/images/beaglebone-yocto/*.wic.bmap
            build/tmp/deploy/images/beaglebone-yocto/*.tar.*

      - name: Cleanup
        run: docker compose down -v
