name: Build Kabanos Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Yocto sstate cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sstate-cache
            downloads
          key: yocto-sstate-${{ hashFiles('Dockerfile', 'build.sh', 'build/conf/bblayers.conf') }}
          restore-keys: |
            yocto-sstate-

      - name: Fix workspace permissions for container user
        run: sudo chown -R 1000:1000 $GITHUB_WORKSPACE

      - name: Build Docker image
        run: docker compose build

      - name: Run Yocto build
        run: |
          docker compose up -d
          docker compose exec yocto-builder bash build.sh
          docker compose exec yocto-builder bash -c "source openembedded-core/oe-init-build-env build && bitbake kabanos-image"

      - name: Upload WIC image
        uses: actions/upload-artifact@v4
        with:
          name: kabanos-image
          path: |
            build/tmp/deploy/images/*/kabanos-image-*.wic
            build/tmp/deploy/images/*/*.wic.bmap
          compression-level: 9
          retention-days: 30

      - name: Upload rootfs tarball
        uses: actions/upload-artifact@v4
        with:
          name: kabanos-rootfs
          path: build/tmp/deploy/images/*/*.tar.*
          compression-level: 9
          retention-days: 30

      - name: Cleanup
        run: docker compose down -v

      - name: Save Yocto sstate cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            sstate-cache
            downloads
          key: yocto-sstate-${{ hashFiles('Dockerfile', 'build.sh', 'build/conf/bblayers.conf') }}

  qemu-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download WIC image
        uses: actions/download-artifact@v4
        with:
          name: kabanos-image
          path: wic-image

      - name: Fix workspace permissions for container user
        run: sudo chown -R 1000:1000 $GITHUB_WORKSPACE

      - name: Build Docker image
        run: docker compose build

      - name: Start container
        run: docker compose up -d

      - name: Copy WIC image into container
        run: |
          WIC_FILE=$(find wic-image -name "kabanos-image-*.wic" | head -1)
          echo "Found WIC image: $WIC_FILE"
          docker cp "$WIC_FILE" yocto-builder:/tmp/kabanos-image.wic

      - name: Run QEMU smoke test
        run: |
          docker compose exec yocto-builder bash -c '\
            WIC_IMAGE="/tmp/kabanos-image.wic"; \
            echo "Booting QEMU with $WIC_IMAGE"; \
            timeout 120 qemu-system-arm \
              -M beaglebone \
              -m 2048 \
              -drive file="$WIC_IMAGE",format=raw,if=virtio \
              -netdev user,id=net0 \
              -device virtio-net-device,netdev=net0 \
              -nographic \
              -serial mon:stdio \
              2>&1 | tee /tmp/qemu.log || true; \
            echo "=== QEMU LOG ==="; \
            cat /tmp/qemu.log || true; \
            if grep -qiE "Linux version|Booting Linux|login:|Password:|root@" /tmp/qemu.log; then \
              echo "QEMU boot successful"; \
              exit 0; \
            else \
              echo "QEMU boot did not show expected output"; \
              exit 1; \
            fi \
          '

      - name: Cleanup
        run: docker compose down -v
